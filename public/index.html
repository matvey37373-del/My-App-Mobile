<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мобильный Дизайн-Редактор</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">

    <header class="bg-white border-b px-4 py-3 flex justify-between items-center shadow-sm">
        <h1 class="text-lg font-bold text-gray-800">🎨 Редактор</h1>
        <div class="space-x-1">
            <button onclick="saveProject()" class="bg-blue-600 text-white text-sm px-3 py-1.5 rounded-lg">Сохранить</button>
            <button onclick="showPreview()" class="bg-green-600 text-white text-sm px-3 py-1.5 rounded-lg">Превью</button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <aside class="w-64 bg-white border-r flex flex-col">
            <div class="p-3 border-b font-semibold text-gray-700 text-sm">Проекты</div>
            <div id="projectList" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
            <div class="p-3 border-t">
                <button onclick="createProject()" class="w-full bg-indigo-600 text-white py-2 text-sm rounded-lg">+ Новый</button>
            </div>
        </aside>

        <main class="flex-1 relative bg-gray-50 overflow-auto flex items-center justify-center p-4">
            <div id="canvas" class="w-[800px] h-[600px] bg-white shadow-lg relative border rounded-lg overflow-hidden"></div>
        </main>
    </div>

    <footer class="bg-white border-t p-2 flex gap-2 items-center justify-around shadow-inner">
        <button onclick="addElement('text')" class="px-3 py-1.5 bg-gray-200 text-sm rounded">📝 Текст</button>
        <button onclick="addElement('circle')" class="px-3 py-1.5 bg-gray-200 text-sm rounded">⚪ Круг</button>
        <button onclick="clearCanvas()" class="px-3 py-1.5 bg-red-100 text-red-600 text-sm rounded">🗑️ Очистить</button>
    </footer>

    <script>
        let projects = JSON.parse(localStorage.getItem('cloud_projects')) || {};
        let currentProjectName = null;

        function renderProjects() {
            const list = document.getElementById('projectList');
            list.innerHTML = '';
            for (let name in projects) {
                let div = document.createElement('div');
                div.className = `p-2 rounded cursor-pointer flex justify-between items-center text-sm ${name === currentProjectName ? 'bg-indigo-50 text-indigo-700 font-bold' : 'hover:bg-gray-100'}`;
                div.innerHTML = `<span>${name}</span> 
                    <div>
                        <button onclick="event.stopPropagation(); renameProject('${name}')" class="text-xs text-blue-500 mr-1">✏️</button>
                        <button onclick="event.stopPropagation(); deleteProject('${name}')" class="text-xs text-red-500">❌</button>
                    </div>`;
                div.ondblclick = () => openProject(name);
                list.appendChild(div);
            }
        }

        function createProject() {
            let name = prompt("Название проекта:");
            if (name && !projects[name]) {
                projects[name] = [];
                currentProjectName = name;
                saveProject();
                renderProjects();
                renderCanvas();
            }
        }

        function openProject(name) {
            currentProjectName = name;
            renderProjects();
            renderCanvas();
        }

        function renameProject(oldName) {
            let newName = prompt("Новое название:", oldName);
            if (newName && !projects[newName]) {
                projects[newName] = projects[oldName];
                delete projects[oldName];
                if (currentProjectName === oldName) currentProjectName = newName;
                saveProject();
                renderProjects();
            }
        }

        function deleteProject(name) {
            if (confirm(`Удалить "${name}"?`)) {
                delete projects[name];
                if (currentProjectName === name) {
                    currentProjectName = null;
                    document.getElementById('canvas').innerHTML = '';
                }
                saveProject();
                renderProjects();
            }
        }

        function addElement(type) {
            if (!currentProjectName) {
                alert("Сначала дважды кликните по проекту слева!");
                return;
            }
            projects[currentProjectName].push({ type, x: 50, y: 50, w: 140, h: 80, text: "Блок" });
            renderCanvas();
            saveProject();
        }

        function renderCanvas() {
            const canvas = document.getElementById('canvas');
            canvas.innerHTML = '';
            if (!currentProjectName || !projects[currentProjectName]) return;

            projects[currentProjectName].forEach((el) => {
                let div = document.createElement('div');
                div.className = 'absolute cursor-move border border-dashed border-blue-400 flex items-center justify-center p-2 text-sm';
                div.style.left = el.x + 'px';
                div.style.top = el.y + 'px';
                div.style.width = el.w + 'px';
                div.style.height = el.h + 'px';
                
                if (el.type === 'circle') div.className += ' rounded-full bg-blue-500 text-white';
                else div.className += ' bg-yellow-100 text-gray-800 font-semibold';

                div.innerHTML = el.text;

                let isDragging = false, startX, startY;
                div.onmousedown = (e) => {
                    isDragging = true;
                    startX = e.clientX - el.x;
                    startY = e.clientY - el.y;
                    e.stopPropagation();
                };
                window.onmousemove = (e) => {
                    if (!isDragging) return;
                    el.x = e.clientX - startX;
                    el.y = e.clientY - startY;
                    div.style.left = el.x + 'px';
                    div.style.top = el.y + 'px';
                };
                window.onmouseup = () => { isDragging = false; saveProject(); };

                canvas.appendChild(div);
            });
        }

        function saveProject() {
            localStorage.setItem('cloud_projects', JSON.stringify(projects));
        }

        function clearCanvas() {
            if (currentProjectName) {
                projects[currentProjectName] = [];
                renderCanvas();
                saveProject();
            }
        }

        function showPreview() {
            if (!currentProjectName) return alert("Выберите проект!");
            let win = window.open();
            win.document.write(`<html><head><title>Превью</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-white flex items-center justify-center h-screen"><div class="relative w-[800px] h-[600px] border">`);
            projects[currentProjectName].forEach(el => {
                let bg = el.type === 'circle' ? 'rounded-full bg-blue-500 text-white' : 'bg-yellow-100';
                win.document.write(`<div class="absolute flex items-center justify-center ${bg}" style="left:${el.x}px; top:${el.y}px; width:${el.w}px; height:${el.h}px;">${el.text}</div>`);
            });
            win.document.write(`</div></body></html>`);
        }

        renderProjects();
    </script>
</body>
</html>
